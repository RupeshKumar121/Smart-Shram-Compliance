<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Shram Compliance — AI Compliance Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#0B1F3A;
  --navy-800:#102A4C;
  --navy-700:#173B66;
  --blue-600:#1F5EA8;
  --blue-500:#2B6FC4;
  --saffron:#E58A1F;
  --saffron-bg:#FDF3E4;
  --green:#1B7A3D;
  --green-bg:#E9F6EE;
  --amber:#B5760A;
  --amber-bg:#FCF1DD;
  --red:#B23A2E;
  --red-bg:#FBEAE7;
  --bg:#F3F5F8;
  --card:#FFFFFF;
  --ink:#152238;
  --ink-soft:#4B5871;
  --ink-faint:#7C879B;
  --border:#DCE2EB;
  --border-soft:#EAEEF3;
  --focus:#2B6FC4;
  --font-serif:'Noto Serif',Georgia,serif;
  --font-sans:'Noto Sans',Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-sans);
  background:var(--bg);
  color:var(--ink);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
h1,h2,h3,h4{font-family:var(--font-serif);margin:0 0 8px 0;font-weight:600;color:var(--navy-900);}
p{margin:0 0 10px 0;}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
img{max-width:100%;}

/* ---------- Top disclaimer ---------- */
.disclaimer-bar{
  background:var(--navy-900);
  color:#D7E2F2;
  font-size:12.5px;
  text-align:center;
  padding:6px 14px;
  letter-spacing:.2px;
}
.disclaimer-bar b{color:#fff;}

/* ---------- Layout shell ---------- */
#app{min-height:100vh;}
.shell{display:flex;min-height:calc(100vh - 28px);}
.sidebar{
  width:236px;flex:none;background:var(--navy-900);color:#CFDAEC;
  padding:20px 14px 20px;display:flex;flex-direction:column;gap:2px;
}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px;}
.sidebar .brand .mark{width:34px;height:34px;border-radius:7px;background:linear-gradient(180deg,var(--saffron),var(--green));display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-weight:700;color:#0B1F3A;font-size:15px;}
.sidebar .brand .name{font-family:var(--font-serif);font-size:15px;color:#fff;line-height:1.2;}
.sidebar .brand .name small{display:block;font-family:var(--font-sans);font-size:10.5px;color:#9FB2CC;font-weight:400;margin-top:1px;}
.sidebar nav{display:flex;flex-direction:column;gap:1px;flex:1;}
.sidebar .navlabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#7A8CAA;margin:14px 10px 6px;}
.sidebar a.navitem{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;font-size:13.6px;color:#C9D6EA;
}
.sidebar a.navitem .ic{width:18px;text-align:center;font-size:14px;}
.sidebar a.navitem:hover{background:rgba(255,255,255,.06);color:#fff;}
.sidebar a.navitem.active{background:rgba(255,255,255,.12);color:#fff;font-weight:600;}
.sidebar .foot{border-top:1px solid rgba(255,255,255,.12);padding-top:12px;margin-top:10px;font-size:12px;color:#8DA0BE;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:#fff;border-bottom:1px solid var(--border);padding:12px 26px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.topbar .who{font-size:13px;color:var(--ink-soft);}
.topbar .who b{color:var(--ink);}
.topbar .actions{display:flex;align-items:center;gap:14px;}
.iconbtn{position:relative;background:none;border:1px solid var(--border);width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink-soft);}
.iconbtn:hover{background:var(--bg);}
.dot{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;font-size:9.5px;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
.linkout{font-size:13px;color:var(--blue-600);font-weight:600;border:1px solid var(--border);padding:7px 12px;border-radius:7px;}
.linkout:hover{background:var(--bg);}
.content{padding:26px 30px 60px;max-width:1180px;width:100%;margin:0 auto;}

/* ---------- Generic components ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px 22px;}
.grid{display:grid;gap:16px;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:820px){.grid-3,.grid-2{grid-template-columns:1fr;}.sidebar{display:none;}}

.btn{display:inline-flex;align-items:center;gap:7px;border-radius:7px;padding:10px 16px;font-size:13.6px;font-weight:600;border:1px solid transparent;}
.btn-primary{background:var(--navy-800);color:#fff;}
.btn-primary:hover{background:var(--navy-700);}
.btn-secondary{background:#fff;border:1px solid var(--border);color:var(--ink);}
.btn-secondary:hover{background:var(--bg);}
.btn-outline-blue{background:#fff;border:1px solid var(--blue-500);color:var(--blue-600);}
.btn-outline-blue:hover{background:#EEF4FC;}
.btn-ghost{background:none;border:none;color:var(--blue-600);font-weight:600;padding:4px 0;}
.btn-sm{padding:6px 11px;font-size:12.5px;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}
.btn-danger-outline{background:#fff;border:1px solid #D9A79C;color:var(--red);}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;}
.pill-green{background:var(--green-bg);color:var(--green);}
.pill-amber{background:var(--amber-bg);color:var(--amber);}
.pill-red{background:var(--red-bg);color:var(--red);}
.pill-blue{background:#E7EFFB;color:var(--blue-600);}
.pill-grey{background:#EEF0F4;color:var(--ink-soft);}

.tag{font-size:11.5px;color:var(--ink-soft);background:var(--bg);border:1px solid var(--border);padding:2px 8px;border-radius:5px;}

hr.rule{border:none;border-top:1px solid var(--border-soft);margin:16px 0;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12.8px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
.field input[type=text],.field input[type=number],.field input[type=email],.field input[type=password],.field select{
  width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:7px;font-size:13.6px;font-family:inherit;background:#fff;color:var(--ink);
}
.field input:focus,.field select:focus{border-color:var(--blue-500);}
.checkline{display:flex;align-items:center;gap:8px;font-size:13.4px;color:var(--ink);margin-bottom:10px;}

table.datatable{width:100%;border-collapse:collapse;font-size:13.4px;}
table.datatable th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);border-bottom:1px solid var(--border);padding:8px 10px;font-weight:600;}
table.datatable td{padding:11px 10px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
table.datatable tr.rowlink{cursor:pointer;}
table.datatable tr.rowlink:hover{background:#F7F9FC;}

.progressbar{height:8px;border-radius:5px;background:var(--border-soft);overflow:hidden;}
.progressbar > div{height:100%;border-radius:5px;}

.accordion-item{border:1px solid var(--border);border-radius:9px;margin-bottom:10px;overflow:hidden;}
.accordion-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;background:#fff;}
.accordion-head:hover{background:#FAFBFC;}
.accordion-body{padding:0 16px 16px;display:none;border-top:1px solid var(--border-soft);}
.accordion-item.open .accordion-body{display:block;padding-top:14px;}
.accordion-item.open .chev{transform:rotate(90deg);}
.chev{transition:transform .15s ease;color:var(--ink-faint);}

.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:13.2px;margin-bottom:6px;}
.kv .k{color:var(--ink-faint);font-weight:600;}

.modal-backdrop{position:fixed;inset:0;background:rgba(11,31,58,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal{background:#fff;border-radius:12px;max-width:520px;width:100%;padding:24px;max-height:86vh;overflow:auto;}
.modal-close{float:right;background:none;border:none;font-size:18px;color:var(--ink-faint);}

.timeline{position:relative;padding-left:22px;}
.timeline:before{content:'';position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--border);}
.timeline-item{position:relative;padding-bottom:18px;}
.timeline-item:before{content:'';position:absolute;left:-22px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--blue-500);border:2px solid #fff;box-shadow:0 0 0 1px var(--blue-500);}
.timeline-item .date{font-size:12px;color:var(--ink-faint);font-weight:600;}
.timeline-item .desc{font-size:13.6px;margin-top:2px;}

.upload-zone{border:1.5px dashed var(--border);border-radius:10px;padding:18px;text-align:center;background:#FAFBFD;}
.upload-zone.drag{border-color:var(--blue-500);background:#EEF4FC;}
.upload-zone .uz-icon{font-size:22px;margin-bottom:6px;}
.doc-cat{border:1px solid var(--border);border-radius:9px;padding:14px;margin-bottom:12px;}
.doc-cat h4{font-size:13.6px;margin:0 0 8px;color:var(--ink);}
.doc-card{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--border-soft);border-radius:7px;padding:8px 10px;margin-top:6px;font-size:12.8px;}
.doc-card .dinfo{display:flex;align-items:center;gap:8px;min-width:0;}
.doc-card .dname{font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;}
.doc-card .dmeta{color:var(--ink-faint);font-size:11.5px;}
.doc-card .drm{background:none;border:none;color:var(--ink-faint);font-size:14px;}

.check-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:13.2px;}
.check-row:last-child{border-bottom:none;}
.dotstatus{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none;}

.stage-list{list-style:none;margin:0;padding:0;}
.stage-list li{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:14px;color:var(--ink-faint);border-bottom:1px solid var(--border-soft);}
.stage-list li:last-child{border-bottom:none;}
.stage-list li.done{color:var(--ink);}
.stage-list li.active{color:var(--navy-900);font-weight:600;}
.stage-list .mark{width:20px;text-align:center;}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--blue-500);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.notif-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--border-soft);font-size:13.4px;}
.notif-item:last-child{border-bottom:none;}
.notif-item .nic{font-size:16px;}
.notif-item .ntime{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}

/* ---------- Landing / login (public) ---------- */
.pub-header{background:var(--navy-900);color:#fff;padding:14px 34px;display:flex;align-items:center;justify-content:space-between;}
.pub-header .brand{display:flex;align-items:center;gap:10px;}
.pub-header .brand .mark{width:36px;height:36px;border-radius:8px;background:linear-gradient(180deg,var(--saffron),var(--green));display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-weight:700;color:#0B1F3A;}
.pub-header .brand .name{font-family:var(--font-serif);font-size:17px;}
.pub-header .brand .name small{display:block;font-family:var(--font-sans);font-size:11px;font-weight:400;color:#B9C7DE;}
.pub-header nav a{margin-left:26px;font-size:13.6px;color:#D6E0F0;}
.pub-header nav a:hover{color:#fff;}

.hero{background:var(--navy-900);color:#fff;padding:64px 34px 80px;}
.hero-inner{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1.15fr 1fr;gap:50px;align-items:center;}
.hero h1{font-family:var(--font-serif);color:#fff;font-size:40px;line-height:1.18;margin-bottom:16px;}
.hero p.lead{color:#C9D6EA;font-size:16.5px;max-width:480px;margin-bottom:26px;}
.hero .cta-row{display:flex;gap:12px;flex-wrap:wrap;}
.btn-hero-primary{background:var(--saffron);color:#241300;border:none;padding:13px 22px;border-radius:8px;font-weight:700;font-size:14px;}
.btn-hero-secondary{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);padding:13px 22px;border-radius:8px;font-weight:600;font-size:14px;}
.flow-diagram{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:22px;}
.flow-steps{display:flex;flex-direction:column;gap:0;}
.flow-step{display:flex;align-items:center;gap:12px;padding:11px 0;}
.flow-step .fnum{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex:none;}
.flow-step .flabel{font-size:14px;color:#EAF0FA;}
.flow-step .fsub{font-size:11.8px;color:#9FB2CC;}
.flow-connector{width:1px;height:14px;background:rgba(255,255,255,.25);margin-left:14px;}

.section{max-width:1180px;margin:0 auto;padding:56px 34px;}
.section h2{font-size:26px;margin-bottom:8px;}
.section .subhead{color:var(--ink-soft);max-width:600px;margin-bottom:30px;}
.value-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.value-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:22px;}
.value-card .vic{font-size:22px;margin-bottom:10px;}
.value-card h3{font-size:16px;margin-bottom:6px;}
.value-card p{color:var(--ink-soft);font-size:13.8px;margin:0;}
@media (max-width:900px){.hero-inner{grid-template-columns:1fr;}.value-cards{grid-template-columns:1fr;}}

.login-wrap{min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center;background:var(--bg);padding:40px 20px;}
.login-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:34px 32px;max-width:420px;width:100%;}
.login-card .lctitle{text-align:center;margin-bottom:4px;}
.login-card .lcsub{text-align:center;color:var(--ink-soft);font-size:13.2px;margin-bottom:24px;}
.role-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:22px;}
.role-toggle button{flex:1;padding:10px;background:#fff;border:none;font-size:13.4px;font-weight:600;color:var(--ink-soft);}
.role-toggle button.active{background:var(--navy-900);color:#fff;}
.captcha-box{border:1px dashed var(--border);border-radius:7px;padding:12px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);font-size:12.6px;color:var(--ink-soft);margin-bottom:16px;}
.login-links{display:flex;justify-content:space-between;font-size:12.6px;margin-top:14px;}
.login-links a{color:var(--blue-600);font-weight:600;}
.footer-note{margin-top:24px;text-align:center;font-size:11.6px;color:var(--ink-faint);}

.footer-pub{background:var(--navy-900);color:#9FB2CC;padding:26px 34px;font-size:12.2px;text-align:center;}

.banner-proto{background:var(--saffron-bg);border:1px solid #F0D6A8;color:#7A4E0C;border-radius:9px;padding:12px 16px;font-size:12.8px;margin-bottom:18px;}
.banner-proto b{color:#5F3B08;}

.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.pagehead .sub{color:var(--ink-soft);font-size:13.8px;margin-top:2px;}

.stat-big{font-family:var(--font-serif);font-size:38px;color:var(--navy-900);line-height:1;}
.stat-label{font-size:12.5px;color:var(--ink-soft);margin-top:6px;}

.filter-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center;}
.filter-bar select,.filter-bar input[type=text]{padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:12.8px;font-family:inherit;background:#fff;}

.breadcrumb{font-size:12.6px;color:var(--ink-faint);margin-bottom:10px;}
.breadcrumb a{color:var(--blue-600);}

.info-icon{cursor:pointer;font-size:12px;color:var(--blue-600);border:1px solid var(--blue-500);border-radius:50%;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   DATA
========================================================= */
var DOC_CATEGORIES = [
  "Establishment Registration","Payroll / Wage Records","Attendance / Overtime",
  "EPF / ESI Records","Employee Register","Safety & Health Records",
  "Contractor Records","Licences / Certificates","Other Compliance Documents"
];

var CATEGORY_DEFS = [
  {id:"wages", name:"Wages & Payroll"},
  {id:"social", name:"Social Security"},
  {id:"safety", name:"Occupational Safety & Working Conditions"},
  {id:"ir", name:"Industrial Relations"},
  {id:"contractor", name:"Contractor / Workforce Compliance"},
  {id:"registration", name:"Establishment & Registration"}
];

var STATUS_META = {
  compliant:{label:"Compliant", color:"green", icon:"\uD83D\uDFE2"},
  review:{label:"Needs Review", color:"amber", icon:"\uD83D\uDFE0"},
  gap:{label:"Potential Gap", color:"red", icon:"\uD83D\uDD34"},
  missing:{label:"Evidence Not Found", color:"amber", icon:"\uD83D\uDFE0"},
  resolved:{label:"Resolved", color:"green", icon:"\uD83D\uDFE2"}
};

/* The employer's own establishment demo — ABC Manufacturing Pvt. Ltd. */
var ABC_CHECKS_DEFAULT = [
  // Wages & Payroll
  {id:"c1", category:"wages", requirement:"Minimum wage compliance across worker categories", status:"compliant"},
  {id:"c2", category:"wages", requirement:"Wage payment within statutory timeline", status:"compliant"},
  {id:"c3", category:"wages", requirement:"Deductions within permissible limits", status:"compliant"},
  {id:"c4", category:"wages", requirement:"Wage register / wage slip records available", status:"missing",
    evidenceDoc:"Not located in uploaded set", observation:"No wage register or wage-slip file was found among the documents uploaded so far.",
    expected:"A wage register or wage slips covering the current wage period, as required for establishments of this size.",
    confidence:88, severity:"Medium",
    action:["Check whether the wage register exists as a separate file.","Upload the wage register or wage slip records for the relevant period.","Confirm the requirement is not applicable if wages are handled through a different process."],
    explain:"Required evidence was not located in the uploaded documents. This is not a finding of non-compliance — the record may exist outside the uploaded set."},
  {id:"c5", category:"wages", requirement:"Overtime hours reconciled between attendance and payroll", status:"gap",
    evidenceDoc:"Attendance_April.pdf, April_Payroll.pdf", observation:"Attendance records show 42 overtime hours; payroll records show 31 overtime hours for the same period — a difference of 11 hours affecting 17 employees.",
    expected:"Overtime hours recorded in attendance and overtime hours paid in payroll should reconcile for the same period.",
    confidence:96, severity:"High",
    detail:{attendance:42, payroll:31, diff:11, affected:17},
    action:["Verify the attendance records for the affected employees.","Verify the approved overtime hours for the period.","Reconcile the 11-hour difference between the two records.","Correct payroll or statutory records if required.","Upload the updated record.","Re-run the compliance check."],
    explain:"The attendance and payroll records do not appear consistent for this period. Evidence indicates possible non-compliance — verification recommended."},
  {id:"c6", category:"wages", requirement:"Wage record retention and format", status:"compliant"},
  // Social Security
  {id:"c7", category:"social", requirement:"ESI contribution records maintained", status:"compliant"},
  {id:"c8", category:"social", requirement:"EPF contribution consistency across periods", status:"compliant"},
  {id:"c9", category:"social", requirement:"Statutory coverage extended to eligible employees", status:"compliant"},
  {id:"c10", category:"social", requirement:"Employee headcount consistent across registers used for EPF coverage", status:"review",
    evidenceDoc:"Employee_Register_2026.pdf, April_Payroll.pdf, EPF_Record_August.pdf",
    observation:"Employee Register lists 1,247 employees; payroll lists 1,198; the EPF record lists 1,165 — a spread of 82 records requiring reconciliation.",
    expected:"Employee counts across the employee register, payroll and EPF record should be broadly consistent for the same reporting period.",
    confidence:91, severity:"Medium",
    detail:{register:1247, payroll:1198, epf:1165, gap:82},
    action:["Compare the reporting periods used in each document.","Check for recent joiners, exits or transfers not yet reflected in one of the records.","Confirm employee-category exclusions (e.g. apprentices, contract staff) are handled consistently.","Update the record that is out of date.","Re-run the compliance check."],
    explain:"Potential data inconsistency detected. Possible explanations include differences in reporting periods, recent joiners/exits or employee-category exclusions. Verification recommended — this is not a finding of fraud or wrongdoing."},
  // Safety
  {id:"c11", category:"safety", requirement:"Working hours within statutory limits", status:"compliant"},
  {id:"c12", category:"safety", requirement:"Leave and welfare facility records", status:"compliant"},
  {id:"c13", category:"safety", requirement:"Accident / safety register maintained", status:"compliant"},
  {id:"c14", category:"safety", requirement:"Applicable safety certification currently valid", status:"review",
    evidenceDoc:"Safety_Certificate.pdf", observation:"The uploaded fire safety certificate is dated and appears to expire in 12 days.",
    expected:"A currently valid safety certificate should be on file at all times for establishments carrying out the activities declared.",
    confidence:99, severity:"Medium",
    action:["Check the renewal date with the issuing authority.","Initiate renewal ahead of expiry.","Upload the renewed certificate once received.","Re-run the compliance check."],
    explain:"The certificate on file is approaching its expiry date. Renewing ahead of time avoids a lapse in coverage."},

      name: pick, category: cat, size: sizeMb+" MB",
      uploadedText: est.activityText
    });
  });
  return docs;

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function pill(status){
  var m = STATUS_META[status] || {label:status, color:"grey"};
  return '<span class="pill pill-'+m.color+'">'+m.icon+' '+m.label+'</span>';
}
function dot(status){
  var m = STATUS_META[status] || {color:"grey"};
  var map = {green:"var(--green)", amber:"var(--amber)", red:"var(--red)", grey:"var(--ink-faint)"};
  return '<span class="dotstatus" style="background:'+map[m.color]+'"></span>';
}
function catName(id){ for(var i=0;i<CATEGORY_DEFS.length;i++){ if(CATEGORY_DEFS[i].id===id) return CATEGORY_DEFS[i].name; } return id; }
function riskLevelFromScore(s){ return s>=70?"High":(s>=40?"Medium":"Low"); }
function riskColor(level){ return level==="High"?"red":(level==="Medium"?"amber":"green"); }
function counts(checks){
  var c = {compliant:0, review:0, gap:0, missing:0};
  checks.forEach(function(k){ c[k.status] = (c[k.status]||0)+1; });
  return c;
}
function categoryScore(checks, catId){
  var subset = checks.filter(function(k){ return k.category===catId; });
  if(!subset.length) return 100;
  var ok = subset.filter(function(k){ return k.status==="compliant"; }).length;
  return Math.round(ok/subset.length*100);
}
function overallScore(checks){
  var ok = checks.filter(function(k){ return k.status==="compliant"; }).length;
  return Math.round(ok/checks.length*100);
}
function findEst(id){
  for(var i=0;i<PORTFOLIO.length;i++){ if(PORTFOLIO[i].id===id) return PORTFOLIO[i]; }
  return null;
}
function qs(name){
  var h = location.hash.split("?")[1] || "";
  var params = {};
  h.split("&").forEach(function(p){ if(!p) return; var kv=p.split("="); params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1]||""); });
  return params[name];
}

function runAnalysisAnimation(){
  var items = document.querySelectorAll("#stage-list li");
  if(!items.length) return;
  var i=0;
  function step(){
    if(i>0) { items[i-1].classList.remove("active"); items[i-1].classList.add("done"); items[i-1].querySelector(".mark").innerHTML = "\u2713"; }
    if(i>=items.length){
      document.getElementById("analysis-done").style.display="block";
      STATE.analysisRun = true; saveState();
      return;
    }
    items[i].classList.add("active");
    items[i].querySelector(".mark").innerHTML = '<span class="spin"></span>';
    i++;
    setTimeout(step, 480);
  }
  step();
}

function statCard(num,label,color){
  return '<div class="card"><div class="stat-big" style="'+(color?('color:'+color):'')+'">'+num+'</div><div class="stat-label">'+label+'</div></div>';
}
function selectFilter(id,label,options,val,isSortish){
  return '<select id="'+id+'" title="'+label+'">'+options.map(function(o){
    if(isSortish){ var parts=o.split(":"); return '<option value="'+parts[0]+'" '+(parts[0]===val?"selected":"")+'>'+parts[1]+'</option>'; }
    return '<option value="'+o+'" '+(o===val?"selected":"")+'>'+(o===""?label:o)+'</option>';
  }).join('')+'</select>';
}
function filteredSortedPortfolio(){
  var rows = PORTFOLIO.slice();
  if(inspectorFilterState.risk) rows = rows.filter(function(e){ return e.riskLevel===inspectorFilterState.risk; });
  if(inspectorFilterState.state) rows = rows.filter(function(e){ return e.state===inspectorFilterState.state; });
  if(inspectorFilterState.industry) rows = rows.filter(function(e){ return e.industry===inspectorFilterState.industry; });
  if(inspectorFilterState.search) rows = rows.filter(function(e){ return e.name.toLowerCase().indexOf(inspectorFilterState.search.toLowerCase())>=0; });
  var sort = inspectorFilterState.sort;
  rows.sort(function(a,b){
    if(sort==="risk") return b.risk-a.risk;
    if(sort==="compliance") return a.compliance-b.compliance;
    if(sort==="workers") return b.affectedWorkers-a.affectedWorkers;
    if(sort==="activity") return b.activityDays-a.activityDays;
    if(sort==="issues") return b.openIssues-a.openIssues;
    return 0;
  });
  return rows;
}

function buildRiskReasons(e){
  var r = [];
  if(e.compliance<60) r.push({status:"gap", text: e.openIssues+" potential compliance issues, with compliance at "+e.compliance+"%."});
  else r.push({status:"review", text: e.openIssues+" open issue(s) identified, with compliance at "+e.compliance+"%."});
  if(e.safetyRisk) r.push({status:"gap", text:"At least one safety-related documentation gap."});
  if(e.repeat) r.push({status:"gap", text:"A repeated issue was also flagged in a previous review."});
  if(e.affectedWorkers>100) r.push({status:"review", text: e.affectedWorkers+" workers are potentially affected by open issues."});
  if(e.activityDays>60) r.push({status:"review", text:"No recent compliance activity — last review "+e.activityText+"."});
  else r.push({status:"compliant", text:"Establishment has recent compliance activity ("+e.activityText+")."});
  return r;
}

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-action]");
  if(!t) return;
  var action = t.getAttribute("data-action");

  if(action==="setrole"){
    e.preventDefault();
    location.hash = "#/login?role="+t.getAttribute("data-role");
    render();
  }
  else if(action==="login"){
    e.preventDefault();
    var role = t.getAttribute("data-role");
    STATE.role = role;
    saveState();
    if(role==="employer"){
      location.hash = STATE.onboardingDone ? "#/employer" : "#/onboarding";
    } else {
      location.hash = "#/inspector";
    }
    render();
  }
  else if(action==="logout"){
    e.preventDefault();
    STATE.role = null; saveState();
    location.hash = "#/landing"; render();
  }
  else if(action==="reset-demo"){
    e.preventDefault();
    resetDemo();
  }
  else if(action==="save-onboarding"){
    e.preventDefault();
    STATE.profile = {
      name: val("est-name"), lin: val("est-lin"), industry: val("est-industry"),
      type: val("est-type"), state: val("est-state"), city: val("est-city"),
      employees: parseInt(val("est-employees"))||0, contractors: parseInt(val("est-contractors"))||0,
      hazardous: checked("est-hazardous")?"yes":"no", migrant: checked("est-migrant")?"yes":"no",
      multiState: checked("est-multistate")?"yes":"no"
    };
    STATE.onboardingDone = true;
    saveState();
    location.hash = "#/employer/upload"; render();
  }
  else if(action==="edit-profile"){
    e.preventDefault();
    location.hash = "#/onboarding"; render();
  }
  else if(action==="remove-doc"){
    e.preventDefault();
    var id = t.getAttribute("data-id");
    STATE.docs = STATE.docs.filter(function(d){ return d.id!==id; });
    saveState(); render();
  }
  else if(action==="toggle-accordion"){
    e.preventDefault();
    var item = t.closest(".accordion-item");
    item.classList.toggle("open");
  }
  else if(action==="view-evidence"){
    e.preventDefault();
    var id = t.getAttribute("data-id");
    location.hash = "#/employer/issue?id="+id; render();
  }
  else if(action==="rerun-verification"){
    e.preventDefault();
    var id = t.getAttribute("data-id");
    var btn = t;
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Re-verifying…';
    setTimeout(function(){
      STATE.checks = STATE.checks.map(function(k){
        if(k.id===id){ var copy = Object.assign({}, k); copy.status = "resolved"; return copy; }
        return k;
      });
      var resolvedIssue = STATE.checks.filter(function(k){return k.id===id;})[0];
      STATE.history.push({date:"16 Sep 2026", desc:"Evidence updated and re-verified — "+ (resolvedIssue?resolvedIssue.requirement:"issue") +" resolved"});
      STATE.employerNotifs.unshift({icon:"\u2713", text:(resolvedIssue?resolvedIssue.requirement:"Issue")+" resolved.", time:"Just now"});
      saveState();
      location.hash = "#/employer/results";
      render();
    }, 1400);
  }
  else if(action==="open-est"){
    e.preventDefault();
    var id = t.getAttribute("data-id");
    if(id==="est-abc"){
      // ABC is the employer's own establishment; show detail using its live check data
    }
    location.hash = "#/inspector/establishment?id="+id; render();
  }
  else if(action==="show-risk-info"){
    e.preventDefault();
    var wrap = document.createElement("div");
    wrap.innerHTML = riskInfoModalHtml();
    document.body.appendChild(wrap.firstChild);
  }
  else if(action==="view-document"){
    e.preventDefault();
    var wrap2 = document.createElement("div");
    wrap2.innerHTML = docViewModalHtml(t.getAttribute("data-name"), t.getAttribute("data-category"), t.getAttribute("data-size"));
    document.body.appendChild(wrap2.firstChild);
  }
  else if(action==="close-modal"){
    e.preventDefault();
    var modal = t.closest(".modal-backdrop");
    if(modal) modal.remove();
  }
});

document.addEventListener("change", function(e){
  if(e.target.matches("[data-fileinput]")){
    handleFiles(e.target.files, e.target.getAttribute("data-category"), e.target.getAttribute("data-resolve-id"));
    e.target.value = "";
  }
});
document.addEventListener("dragover", function(e){
  var z = e.target.closest("[data-dropzone]");
  if(z){ e.preventDefault(); z.classList.add("drag"); }
});
document.addEventListener("dragleave", function(e){
  var z = e.target.closest("[data-dropzone]");
  if(z){ z.classList.remove("drag"); }
});
document.addEventListener("drop", function(e){
  var z = e.target.closest("[data-dropzone]");
  if(z){
    e.preventDefault(); z.classList.remove("drag");
    handleFiles(e.dataTransfer.files, z.getAttribute("data-category"), z.getAttribute("data-resolve-id"));
  }
});
function handleFiles(fileList, category, resolveId){
  if(!fileList || !fileList.length) return;
  Array.prototype.forEach.call(fileList, function(f){
    STATE.docs.push({
      id: "d"+Date.now()+Math.random().toString(16).slice(2),
      name: f.name, category: category || "Other Compliance Documents",
      size: (f.size/1024/1024).toFixed(1)+" MB"
    });
  });
  saveState();
  if(resolveId){
    // stay on the issue page; just re-render so the uploaded file shows nowhere specific but state is saved
    render();
  } else {
    render();
  }
}

/* =========================================================
   INIT
========================================================= */
if(!location.hash){ location.hash = "#/landing"; }
render();
</script>
</body>
</html>
